appId: dev.weftdesk.app
productName: WeftDesk
copyright: Copyright © 2026 WeftDesk

directories:
  buildResources: resources
  output: ../../dist

files:
  - out/**/*
  - resources/**/*
  - package.json
  - "!node_modules/**/*"
  - "!**/*.map"

extraResources:
  - from: ../../bin
    to: bin
    filter:
      - weft
      - weft.exe

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/weftdesk-icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: WeftDesk
  artifactName: WeftDesk-${version}-setup.${ext}

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: resources/weftdesk-icon.icns
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
  icon: resources/png/weftdesk-icon-256.png
  category: Development
  artifactName: WeftDesk-${version}.${ext}
